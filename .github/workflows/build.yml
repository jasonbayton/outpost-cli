# PR-time build + vet check.
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -o outpost ./cmd/outpost

      - name: smoke test
        run: ./outpost --help
